id = "kakahn.worktree-from-linear"
name = "Worktree from Linear"
version = "1.0.0"
min_herdr_version = "0.9.0"
description = "Create a git worktree from a Linear issue and open it as a workspace"
platforms = ["linux", "macos"]

[[actions]]
id = "pick"
title = "Linear · Worktree from Linear issue"
contexts = ["workspace", "tab", "pane"]
command = ["node", "bin/open.js"]

[[panes]]
id = "picker"
title = "Pick a Linear issue"
placement = "overlay"
command = ["node", "bin/picker.js"]

[[panes]]
id = "issue"
title = "Linear issue"
placement = "split"
command = ["node", "bin/issue.js"]

[[actions]]
id = "search"
title = "Linear · Find issue by identifier"
contexts = ["workspace", "tab", "pane"]
command = ["node", "bin/open.js", "--direct"]

[[panes]]
id = "tool"
title = "Linear · Development"
placement = "split"
command = ["node", "bin/tool.js"]

[[panes]]
id = "restore"
title = "Linear · Preparation and restoration"
placement = "split"
command = ["node", "bin/restore.js"]

[[events]]
on = "worktree.opened"
command = ["node", "bin/event.js"]
